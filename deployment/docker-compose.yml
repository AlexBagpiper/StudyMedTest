services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: medtest-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medtest_db}
      POSTGRES_USER: ${POSTGRES_USER:-medtest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medtest_user} -d ${POSTGRES_DB:-medtest_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medtest-network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: medtest-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medtest-network

  # MinIO Object Storage (S3-compatible)
  minio:
    image: medtest-minio:2025-09-07
    build:
      context: ./minio
      dockerfile: Dockerfile
      args:
        MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
    container_name: medtest-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - medtest-network

  # Backend API (FastAPI)
  backend:
    image: medtest-backend:${APP_VERSION:-1.4.3}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: medtest-backend
    restart: always
    env_file: .env
    volumes:
      - ../docs/wiki:/app/docs/wiki:ro
    command: >
      sh -c "sh /app/scripts/init.sh && 
            uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - medtest-network

  # Celery Worker
  celery_worker:
    image: medtest-backend:${APP_VERSION:-1.4.3}
    container_name: medtest-celery-worker
    restart: always
    env_file: .env
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 --queues=celery
    depends_on:
      - redis
      - db
    networks:
      - medtest-network

  # Celery Email Worker
  celery_email_worker:
    image: medtest-backend:${APP_VERSION:-1.4.3}
    container_name: medtest-celery-email-worker
    restart: always
    env_file: .env
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 --queues=email --prefetch-multiplier=4 -n email@%h
    depends_on:
      - redis
    networks:
      - medtest-network

  # Frontend (React)
  frontend:
    image: medtest-frontend:${APP_VERSION:-1.4.3}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_APP_VERSION: ${APP_VERSION:-1.4.3}
    container_name: medtest-frontend
    restart: always
    networks:
      - medtest-network

  # Nginx (Reverse Proxy with Auto-SSL)
  nginx:
    image: jonasal/nginx-certbot:latest
    container_name: medtest-nginx
    restart: always
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    depends_on:
      - backend
      - frontend
    networks:
      - medtest-network

  # Mail Server (Mox)
  # Yandex Cloud drops outbound TCP/25 except Yandex Mail MX.
  # Outbound OTP: Яндекс 360 smtp.yandex.ru:465 (SMTP_RELAY_*), never HTTP.
  mail:
    image: r.xmox.nl/mox:latest
    container_name: medtest-mail
    restart: always
    working_dir: /data
    extra_hosts:
      - "${DOMAIN_NAME}:127.0.0.1"
      - "${MAIL_DOMAIN_NAME}:127.0.0.1"
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - ./mox-data:/data
      - ./nginx/certs:/certs:ro
    networks:
      - medtest-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  medtest-network:
    driver: bridge
